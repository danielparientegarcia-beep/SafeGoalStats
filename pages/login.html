<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - SafeGoalStats</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <h1>Iniciar sesión</h1>

  <form id="form-login">

    <input 
      type="email" 
      id="email" 
      placeholder="Email" 
      required
    >

    <input 
      type="password" 
      id="password" 
      placeholder="Contraseña" 
      required
    >

    <button type="submit">Entrar</button>

  </form>

  <p id="error"></p>

  <script src="../js/login.js"></script>

</body>
</html>
