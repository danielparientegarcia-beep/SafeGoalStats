<!-- LOGIN FORM ya correcto, no toca nada -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("form-login");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("https://safegoalstats-api-production.up.railway.app/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem("token", data.token);
        alert("Login correcto");
        window.location.href = "/";
      } else {
        const err = document.getElementById("error");
        err.textContent = data.mensaje || "Error en login";
        err.className = "form-message error";
      }
    } catch (error) {
      console.error(error);
      const err = document.getElementById("error");
      err.textContent = "Error de conexión con el servidor";
      err.className = "form-message error";
    }
  });
});
</script>

<!-- REGISTRO FORM corregido -->
<script>
const regForm = document.getElementById('registroForm');
const mensaje = document.getElementById('mensaje');

regForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const email = document.getElementById('email-reg').value;
  const password = document.getElementById('password-reg').value;

  try {
    const res = await fetch('https://safegoalstats-api-production.up.railway.app/api/auth/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();

    if (res.ok) {
      mensaje.textContent = '✅ Usuario registrado correctamente';
      mensaje.className = 'form-message success';
      regForm.reset();
      setTimeout(() => switchTab('login'), 1800);
    } else {
      mensaje.textContent = '❌ ' + (data.error || data.mensaje);
      mensaje.className = 'form-message error';
    }
  } catch (error) {
    mensaje.textContent = '❌ Error de conexión con el servidor';
    mensaje.className = 'form-message error';
  }
});
</script>
