<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partidos | SafeGoalStats</title>
<link rel="stylesheet" href="../css/style.css">

<script>
if (localStorage.getItem("tema") === "claro") {
    document.documentElement.classList.add("claro");
}
</script>
</head>

<body>

<header>
  <a href="../index.html" class="logo">
    <span class="logo-dot"></span>
    SafeGoalStats
  </a>

  <nav>
    <a href="../index.html">Inicio</a>
    <a href="partidos.html" class="activo">Partidos</a>
    <a href="clasificacion.html">Clasificación</a>
    <a href="estadisticas.html">Estadísticas</a>
    <a href="seguridad.html">Seguridad</a>
    <span id="nav-auth"></span>
  </nav>
</header>


<main>

<div class="page-header">
  <h2 class="titulo-pagina">Partidos de LaLiga</h2>
  <p style="color:var(--text-secondary)">Últimos y próximos encuentros en tiempo real</p>
</div>

<!-- LOADING -->
<div id="loading">Cargando partidos...</div>

<!-- LISTA PARTIDOS -->
<section id="partidos-container" style="display:none"></section>

</main>


<footer>
  <p>© 2026 SafeGoalStats</p>
</footer>

<button id="toggleTema">🌙</button>


<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>


<script>
if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
}

const container = document.getElementById("partidos-container");
const loading = document.getElementById("loading");


function formatearFecha(fecha) {
    const d = new Date(fecha);
    return d.toLocaleDateString("es-ES", {
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function crearPartido(p) {
    const home = p.homeTeam?.name;
    const away = p.awayTeam?.name;
    const status = p.status;
    const date = formatearFecha(p.utcDate);

    let marcador = "";

    if (status === "FINISHED") {
        marcador = `<strong>${p.score.fullTime.home} - ${p.score.fullTime.away}</strong>`;
    } else {
        marcador = `<span style="color:var(--accent-gold)">VS</span>`;
    }

    return `
        <div class="bloque" style="margin-bottom:10px; padding:15px;">
            <div style="display:flex; justify-content:space-between;">
                <span>${home}</span>
                ${marcador}
                <span>${away}</span>
            </div>
            <small style="color:var(--text-secondary)">${date}</small>
        </div>
    `;
}


async function cargarPartidos() {
    try {
        const res = await fetch("http://192.168.239.119:3000/api/partidos");
        const data = await res.json();

        const partidos = data.matches;

        container.innerHTML = partidos.map(crearPartido).join("");

        loading.style.display = "none";
        container.style.display = "block";

    } catch (err) {
        console.error(err);
        loading.innerHTML = "Error cargando partidos";
    }
}

cargarPartidos();
</script>

</body>
</html>
