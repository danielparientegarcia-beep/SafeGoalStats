<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro | SafeGoalStats</title>
<link rel="stylesheet" href="../css/style.css">

<script>
const tema = localStorage.getItem("tema");
if(tema === "claro"){
  document.documentElement.classList.add("claro");
}
</script>
</head>

<body>

<header>
<h1 class="logo">SafeGoalStats</h1>
<nav>
<a href="../index.html">Inicio</a>
<a href="partidos.html">Partidos</a>
<a href="clasificacion.html">Clasificación</a>
<a href="estadisticas.html">Estadísticas</a>
<a href="seguridad.html">Seguridad</a>
<a href="registro.html" class="registro">Registrar</a>
</nav>
</header>

<main>

<h2 class="titulo-pagina">Registro</h2>

<section class="bloque">
<h3>Crear cuenta</h3>

<p>En esta sección el usuario puede registrarse para acceder a futuras funciones.</p>

<form id="registroForm">

<label>Usuario</label>
<input type="text" id="username" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Contraseña</label>
<input type="password" id="password" required>

<button type="submit">Registrar</button>

</form>

<div id="mensaje"></div>

</section>
</main>

<footer>
<p>© 2026 Proyecto creado por Daniel Pariente y Alex Rubio</p>
</footer>

<script src="../js/registro.js"></script>
<script src="../js/app.js"></script>
<script src="../js/main.js"></script>

<script>
const btnTema = document.getElementById('toggleTema');

if(btnTema){
  btnTema.addEventListener('click', () => {
    document.body.classList.toggle('claro');
    const modoActual = document.body.classList.contains('claro') ? 'claro' : 'oscuro';
    localStorage.setItem('tema', modoActual);
  });
}
</script>

</body>
</html>
