<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas | SafeGoalStats</title>
<link rel="stylesheet" href="../css/style.css">

<script>
if (localStorage.getItem("tema") === "claro") {
    document.documentElement.classList.add("claro");
}
</script>
</head>

<body>

<header>
  <a href="../index.html" class="logo">
    <span class="logo-dot"></span>
    SafeGoalStats
  </a>

  <nav>
    <a href="../index.html">Inicio</a>
    <a href="partidos.html">Partidos</a>
    <a href="clasificacion.html">Clasificación</a>
    <a href="estadisticas.html" class="activo">Estadísticas</a>
    <a href="seguridad.html">Seguridad</a>
    <span id="nav-auth"></span>
  </nav>
</header>

<main>

<div class="page-header">
  <h2 class="titulo-pagina">Estadísticas de LaLiga</h2>
  <p style="color:var(--text-secondary)">Goleadores y asistentes actualizados en tiempo real</p>
</div>

<div id="loading">Cargando estadísticas...</div>

<section id="stats-container" class="stats-grid" style="display:none"></section>

</main>

<footer>
  <p>© 2026 SafeGoalStats</p>
</footer>

<button id="toggleTema">🌙</button>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>


<script>
if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
}

const container = document.getElementById("stats-container");
const loading = document.getElementById("loading");


function crearJugador(j, valor, label, maxValor) {
    const porcentaje = Math.max((valor / maxValor) * 100, 10);
    return `
        <div class="bloque jugador-card fade-slide-up">
            <div class="jugador-avatar">${j.player.name.charAt(0)}</div>
            <div class="jugador-info">
                <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">
                    <div>
                        <strong>${j.player.name}</strong><br>
                        <small style="color:var(--text-secondary)">${j.team.name}</small>
                    </div>
                    <span style="color:var(--accent-gold);font-weight:700;">${valor} ${label}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-value" style="width:${porcentaje}%"></div>
                </div>
            </div>
        </div>
    `;
}


async function cargarStats() {
    try {
        const res = await fetch("/api/estadisticas");
        const data = await res.json();

        const scorers = data.scorers || [];

        const maxGoles = Math.max(...scorers.map(j => j.goals), 1);

        container.innerHTML = `
            <div class="stats-column">
                <div class="bloque"><h3>Máximos goleadores</h3></div>
                ${scorers.map(j => crearJugador(j, j.goals, 'goles', maxGoles)).join('')}
            </div>
        `;

        loading.style.display = "none";
        container.style.display = "block";

    } catch (err) {
        console.error(err);
        loading.innerHTML = "Error cargando estadísticas";
    }
}

cargarStats();
</script>

</body>
</html>
