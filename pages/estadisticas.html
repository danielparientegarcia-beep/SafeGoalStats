<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Estadísticas | SafeGoalStats</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/script.js" defer></script>

<script>
const tema=localStorage.getItem("tema");
if(tema==="claro"){
document.documentElement.classList.add("claro");
}
</script>
</head>
<body>

<header>
<h1 class="logo">SafeGoalStats</h1>
<nav>
<a href="../index.html">Inicio</a>
<a href="partidos.html">Partidos</a>
<a href="clasificacion.html">Clasificación</a>
<a href="estadisticas.html">Estadísticas</a>
<a href="seguridad.html">Seguridad</a>
<a href="registro.html" class="registro">Registrar</a>
</nav>
</header>

<main>

<h2 class="titulo-pagina">Estadísticas</h2>

<section class="bloque estadisticas-grid">

<div class="stat-card">
<h3>Goles totales</h3>
<p class="stat-numero" id="goles">1234</p>
</div>

<div class="stat-card">
<h3>Partidos jugados</h3>
<p class="stat-numero" id="partidos">380</p>
</div>

<div class="stat-card">
<h3>Amarillas</h3>
<p class="stat-numero" id="amarillas">1450</p>
</div>

<div class="stat-card">
<h3>Rojas</h3>
<p class="stat-numero" id="rojas">120</p>
</div>

</section>

<section class="bloque">
<button onclick="actualizarEstadisticas()">Actualizar datos</button>
</section>

</main>

<footer>
<p>© 2026 Proyecto creado por Daniel Pariente y Alex Rubio</p>
</footer>
<script src="../js/app.js"></script>
<body style="opacity:0;"></body>

<script>
const btnTema = document.getElementById('toggleTema');

if(btnTema){
  btnTema.addEventListener('click', () => {
    document.body.classList.toggle('claro');
    const modoActual = document.body.classList.contains('claro') ? 'claro' : 'oscuro';
    localStorage.setItem('tema', modoActual);
  });
}
</script>

<button id="toggleTema">🌙</button>
<script src="main.js"></script>

</body>
</body>
</html>
