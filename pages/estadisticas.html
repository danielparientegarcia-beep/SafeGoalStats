<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas | SafeGoalStats</title>
<link rel="stylesheet" href="../css/style.css">

<script>
if (localStorage.getItem("tema") === "claro") {
    document.documentElement.classList.add("claro");
}
</script>
</head>

<body>

<header>
  <a href="../index.html" class="logo">
    <span class="logo-dot"></span>
    SafeGoalStats
  </a>

  <nav>
    <a href="../index.html">Inicio</a>
    <a href="partidos.html">Partidos</a>
    <a href="clasificacion.html">Clasificación</a>
    <a href="estadisticas.html" class="activo">Estadísticas</a>
    <a href="seguridad.html">Seguridad</a>
    <span id="nav-auth"></span>
  </nav>
</header>

<main>

<div class="page-header">
  <h2 class="titulo-pagina">Estadísticas de LaLiga</h2>
  <p style="color:var(--text-secondary)">Máximos goleadores en tiempo real</p>
</div>

<div id="loading">Cargando estadísticas...</div>

<section id="stats-container" style="display:none"></section>

</main>

<footer>
  <p>© 2026 SafeGoalStats</p>
</footer>

<button id="toggleTema">🌙</button>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>


<script>
if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
}

const container = document.getElementById("stats-container");
const loading = document.getElementById("loading");


function crearJugador(j) {
    return `
        <div class="bloque" style="padding:15px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between;">
                <strong>${j.player.name}</strong>
                <span style="color:var(--accent-gold)">${j.goals} goles</span>
            </div>
            <small style="color:var(--text-secondary)">
                ${j.team.name}
            </small>
        </div>
    `;
}


async function cargarStats() {
    try {
        const res = await fetch("http://localhost:3000/api/estadisticas");
        const data = await res.json();

        const scorers = data.scorers;

        container.innerHTML = scorers.map(crearJugador).join("");

        loading.style.display = "none";
        container.style.display = "block";

    } catch (err) {
        console.error(err);
        loading.innerHTML = "Error cargando estadísticas";
    }
}

cargarStats();
</script>

</body>
</html>
